services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scaleelapse}
      POSTGRES_USER: ${POSTGRES_USER:-scaleelapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 12
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - uploads:/app/media
      - ./models:/app/models:ro
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on: [backend]
volumes:
  pgdata:
  uploads:
